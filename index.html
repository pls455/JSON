<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#070b14"><title>اختبر نفسك | منصة الاختبارات</title><style>
:root{--bg:#070b14;--card:#10192b;--line:#24324b;--text:#f5f7ff;--muted:#91a0b8;--p:#6d5dfc;--p2:#27c7d9;--good:#39d98a;--bad:#ff6078}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 10% 0,#6d5dfc2b,transparent 30%),radial-gradient(circle at 90% 20%,#27c7d91c,transparent 28%),var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif}.wrap{width:min(1080px,calc(100% - 22px));margin:auto;padding:24px 0 50px}.hero{text-align:center;padding:28px 0}.badge{display:inline-block;padding:7px 12px;border:1px solid var(--line);border-radius:999px;color:#c9c3ff;background:#ffffff08;font-size:11px}.hero h1{font-size:clamp(38px,8vw,68px);letter-spacing:-3px;margin:15px 0 8px;background:linear-gradient(100deg,#fff,#b9b0ff,#76e9f5);-webkit-background-clip:text;color:transparent}.hero p{color:var(--muted);max-width:620px;margin:auto;line-height:1.8;font-size:13px}.panel{background:#10192bd9;border:1px solid var(--line);border-radius:22px;padding:18px;box-shadow:0 25px 75px #0006;backdrop-filter:blur(16px);animation:up .45s ease both}.steps{display:flex;gap:8px;margin-bottom:16px;overflow:auto}.step{flex:1;min-width:120px;padding:11px;border:1px solid var(--line);border-radius:13px;text-align:center;color:var(--muted);font-size:11px}.step.active{color:#fff;border-color:#6d5dfc88;background:#6d5dfc18}.step.done{color:#b8f1db;border-color:#39d98a55}.step b{display:block;font-size:13px;margin-bottom:3px}.selection{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.field label{display:block;font-size:11px;color:#b8c5d6;font-weight:750;margin-bottom:7px}.field select{width:100%;padding:12px;border-radius:13px;border:1px solid var(--line);background:#091220;color:var(--text);outline:none}.field select:focus{border-color:#6d5dfc}.quiz-list{display:grid;gap:10px;margin-top:16px}.quiz{display:flex;align-items:center;justify-content:space-between;gap:15px;padding:15px;border:1px solid var(--line);border-radius:16px;background:#ffffff04;transition:.2s}.quiz:hover{transform:translateY(-2px);border-color:#6d5dfc66}.quiz h3{margin:0 0 5px;font-size:14px}.quiz p{margin:0;color:var(--muted);font-size:11px}.btn{border:1px solid var(--line);border-radius:12px;padding:10px 15px;background:#17233a;color:#fff;font:inherit;font-weight:800;cursor:pointer}.primary{background:linear-gradient(135deg,var(--p),#5141d9);border:0}.back{margin-top:12px}.empty{text-align:center;padding:35px;color:var(--muted);border:1px dashed var(--line);border-radius:16px}.quiz-view{margin-top:16px}.quiz-top{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:14px}.progress{height:7px;background:#ffffff0c;border-radius:99px;overflow:hidden;margin-bottom:18px}.progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--p),var(--p2));transition:.3s}.question h2{font-size:20px;line-height:1.7;margin:0 0 16px}.options{display:grid;gap:9px}.option{width:100%;text-align:right;padding:13px;border:1px solid var(--line);border-radius:13px;background:#0b1423;color:#e8edf7}.option:hover{border-color:#6d5dfc88}.option.selected{border-color:#6d5dfc;background:#6d5dfc18}.option.correct{border-color:var(--good);background:#39d98a12}.option.wrong{border-color:var(--bad);background:#ff607812}.quiz-actions{display:flex;justify-content:space-between;gap:8px;margin-top:16px}.explanation{margin-top:13px;padding:12px;border-radius:12px;background:#ffffff06;color:#aebbd0;font-size:11px;line-height:1.7}.result{text-align:center;padding:30px}.score{font-size:48px;font-weight:900;background:linear-gradient(100deg,#fff,#76e9f5);-webkit-background-clip:text;color:transparent}.hide{display:none!important}footer{text-align:center;color:#5e6b82;font-size:10px;margin-top:22px}@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}@media(max-width:700px){.selection{grid-template-columns:1fr}.quiz{align-items:flex-start;flex-direction:column}.quiz .btn{width:100%}}
</style></head><body><main class="wrap"><header class="hero"><span class="badge">اختبارات متعددة الخيارات · محتوى ديناميكي</span><h1>اختبر نفسك</h1><p>اختر الفرع، ثم المادة، ثم الدرس. بعدها تظهر الاختبارات المتاحة لهذا المسار فقط.</p></header>
<section class="panel"><div class="steps"><div class="step active" id="s1"><b>1</b>الفرع</div><div class="step" id="s2"><b>2</b>المادة</div><div class="step" id="s3"><b>3</b>الدرس</div><div class="step" id="s4"><b>4</b>الاختبار</div></div><div class="selection"><div class="field"><label>الفرع</label><select id="branch"><option value="">اختر الفرع</option></select></div><div class="field"><label>المادة</label><select id="subject" disabled><option value="">اختر المادة</option></select></div><div class="field"><label>الدرس</label><select id="lesson" disabled><option value="">اختر الدرس</option></select></div></div><div id="quizList" class="quiz-list"><div class="empty">اختر الفرع ثم المادة ثم الدرس لعرض الاختبارات.</div></div></section>
<section id="quizView" class="panel quiz-view hide"></section><footer>Quiz Platform · المحتوى يمكن استيراده من JSON ثم ربطه بـ Firebase لاحقًا</footer></main>
<script>
const $=id=>document.getElementById(id);let data={branches:[],subjects:[],lessons:[],quizzes:[]},currentQuiz=null,index=0,score=0,selected=null;
const sample={branches:[{id:'scientific',name:'العلمي'},{id:'literary',name:'الأدبي'}],subjects:[{id:'arabic',name:'اللغة العربية',branchId:'scientific'},{id:'math',name:'الرياضيات',branchId:'scientific'},{id:'arabic-lit',name:'اللغة العربية',branchId:'literary'}],lessons:[{id:'adab',name:'الأدب',subjectId:'arabic'},{id:'matrices',name:'المصفوفات',subjectId:'math'},{id:'adab-lit',name:'الأدب',subjectId:'arabic-lit'}],quizzes:[{id:'demo',title:'اختبار الأدب التجريبي',lessonId:'adab',duration:10,questions:[{text:'ما المقصود بالأدب؟',options:['التعبير الفني عن التجربة الإنسانية','علم الأرقام','نوع من الرياضيات','قواعد البرمجة'],correctIndex:0,explanation:'الأدب تعبير فني ولغوي عن التجربة الإنسانية.'},{text:'أي مما يلي يُعد جنسًا أدبيًا؟',options:['الرواية','المعادلة','الخوارزمية','المعادالج'],correctIndex:0,explanation:'الرواية من الأجناس الأدبية.'}]}]};
function loadData(){try{const saved=localStorage.getItem('quizContent');data=saved?JSON.parse(saved):sample}catch{data=sample}populateBranches()}
function fill(select,items,placeholder){select.innerHTML=`<option value="">${placeholder}</option>`;items.forEach(x=>select.insertAdjacentHTML('beforeend',`<option value="${esc(x.id)}">${esc(x.name||x.title)}</option>`));select.disabled=!items.length}function esc(v){return String(v).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function populateBranches(){fill($('branch'),data.branches,'اختر الفرع');$('subject').innerHTML='<option value="">اختر المادة</option>';$('lesson').innerHTML='<option value="">اختر الدرس</option>';$('subject').disabled=$('lesson').disabled=true}
$('branch').onchange=()=>{const b=$('branch').value;const items=data.subjects.filter(x=>x.branchId===b);fill($('subject'),items,'اختر المادة');$('lesson').innerHTML='<option value="">اختر الدرس</option>';$('lesson').disabled=true;showQuizzes()};$('subject').onchange=()=>{const s=$('subject').value;fill($('lesson'),data.lessons.filter(x=>x.subjectId===s),'اختر الدرس');showQuizzes()};$('lesson').onchange=showQuizzes;
function showQuizzes(){const lesson=$('lesson').value,list=data.quizzes.filter(q=>q.lessonId===lesson),box=$('quizList');if(!lesson){box.innerHTML='<div class="empty">اختر الدرس لعرض الاختبارات.</div>';return}if(!list.length){box.innerHTML='<div class="empty">لا يوجد اختبار لهذا الدرس حاليًا.</div>';return}box.innerHTML=list.map(q=>`<article class="quiz"><div><h3>${esc(q.title)}</h3><p>${q.questions?.length||0} سؤال · ${q.duration||'—'} دقيقة</p></div><button class="btn primary" data-id="${esc(q.id)}">ابدأ الاختبار</button></article>`).join('');box.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>startQuiz(b.dataset.id))}
function startQuiz(id){currentQuiz=data.quizzes.find(q=>q.id===id);index=0;score=0;selected=null;$('quizView').classList.remove('hide');renderQuestion();$('quizView').scrollIntoView({behavior:'smooth',block:'start'})}
function renderQuestion(){const q=currentQuiz.questions[index],total=currentQuiz.questions.length;selected=null;$('quizView').innerHTML=`<div class="quiz-top"><strong>${esc(currentQuiz.title)}</strong><span>${index+1} / ${total}</span></div><div class="progress"><i style="width:${index/total*100}%"></i></div><div class="question"><h2>${esc(q.text)}</h2><div class="options">${q.options.map((o,i)=>`<button class="option" data-i="${i}">${esc(o)}</button>`).join('')}</div></div><div class="quiz-actions"><button class="btn" id="exit">إنهاء</button><button class="btn primary" id="next" disabled>${index===total-1?'إنهاء الاختبار':'التالي'}</button></div>`;$('quizView').querySelectorAll('.option').forEach(b=>b.onclick=()=>choose(+b.dataset.i));$('exit').onclick=()=>{$('quizView').classList.add('hide')};$('next').onclick=nextQuestion}
function choose(i){if(selected!==null)return;selected=i;const q=currentQuiz.questions[index],opts=[...$('quizView').querySelectorAll('.option')];opts[i].classList.add(i===q.correctIndex?'correct':'wrong');if(i===q.correctIndex)score++;if(q.explanation)$('quizView').querySelector('.question').insertAdjacentHTML('beforeend',`<div class="explanation">${esc(q.explanation)}</div>`);$('next').disabled=false}
function nextQuestion(){if(selected===null)return;if(index===currentQuiz.questions.length-1){showResult();return}index++;renderQuestion()}
function showResult(){const total=currentQuiz.questions.length,pct=Math.round(score/total*100);$('quizView').innerHTML=`<div class="result"><div class="badge">انتهى الاختبار</div><h2>نتيجتك</h2><div class="score">${score} / ${total}</div><p style="color:var(--muted)">نسبة النجاح: ${pct}%</p><button class="btn primary" id="again">إعادة الاختبار</button></div>`;$('again').onclick=()=>startQuiz(currentQuiz.id)}
loadData();
</script></body></html>
