<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="تحويل JSON إلى CSV مباشرة داخل المتصفح." />
  <title>JSON → CSV</title>
  <style>
    :root {
      --bg: #0b1020;
      --panel: rgba(18, 25, 45, .82);
      --panel-2: #11182b;
      --border: rgba(255,255,255,.10);
      --text: #f5f7fb;
      --muted: #9aa6bd;
      --accent: #7c5cff;
      --accent-2: #6046e8;
      --danger: #ff6b81;
      --success: #49d39b;
      --shadow: 0 24px 70px rgba(0,0,0,.35);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Tahoma, Arial, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 15% 10%, rgba(124,92,255,.20), transparent 30%),
        radial-gradient(circle at 85% 85%, rgba(73,211,155,.10), transparent 25%),
        var(--bg);
    }

    .container { width: min(1100px, calc(100% - 28px)); margin: 0 auto; padding: 34px 0 50px; }
    header { text-align: center; margin-bottom: 28px; }
    .logo {
      display: inline-flex; align-items: center; gap: 10px;
      padding: 8px 14px; border: 1px solid var(--border); border-radius: 999px;
      background: rgba(255,255,255,.04); color: #cfc7ff; font-size: 13px;
    }
    h1 { margin: 18px 0 8px; font-size: clamp(30px, 6vw, 54px); letter-spacing: -1.5px; }
    header p { margin: 0; color: var(--muted); font-size: 16px; }

    .card {
      background: var(--panel); border: 1px solid var(--border); border-radius: 24px;
      box-shadow: var(--shadow); backdrop-filter: blur(18px); overflow: hidden;
    }
    .editor { padding: 18px; }
    .label-row { display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom:10px; }
    .label { font-weight: 700; }
    .hint { color: var(--muted); font-size: 12px; }
    textarea {
      width: 100%; min-height: 330px; resize: vertical; border: 1px solid var(--border);
      border-radius: 16px; background: #090e1b; color: #dfe6f5; padding: 18px;
      font: 14px/1.7 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      outline: none; direction: ltr; text-align: left;
    }
    textarea:focus { border-color: rgba(124,92,255,.75); box-shadow: 0 0 0 4px rgba(124,92,255,.10); }

    .actions { display:flex; flex-wrap:wrap; gap:10px; margin-top:14px; }
    button {
      border: 0; border-radius: 12px; padding: 12px 18px; cursor:pointer;
      font: inherit; font-weight: 750; transition: .18s ease; color: var(--text);
      background: #202941; border: 1px solid var(--border);
    }
    button:hover { transform: translateY(-1px); filter: brightness(1.08); }
    button.primary { background: linear-gradient(135deg, var(--accent), var(--accent-2)); border-color: transparent; }
    button:disabled { opacity:.45; cursor:not-allowed; transform:none; }

    .status { min-height: 24px; margin-top: 12px; font-size: 13px; color: var(--muted); }
    .status.error { color: var(--danger); }
    .status.success { color: var(--success); }

    .result { margin-top: 18px; }
    .result-head { padding: 18px 18px 0; display:flex; align-items:center; justify-content:space-between; gap:12px; }
    .result-head h2 { margin:0; font-size:18px; }
    .table-wrap { overflow:auto; margin: 14px 18px 18px; border:1px solid var(--border); border-radius:16px; max-height:460px; }
    table { width:100%; border-collapse:collapse; min-width:520px; direction:ltr; }
    th, td { padding:11px 13px; border-bottom:1px solid var(--border); text-align:left; white-space:nowrap; }
    th { position:sticky; top:0; background:var(--panel-2); color:#d9d2ff; font-size:13px; z-index:1; }
    td { color:#d4dbea; font-size:13px; }
    tr:last-child td { border-bottom:0; }

    .empty { padding: 45px 20px; text-align:center; color:var(--muted); }
    footer { text-align:center; color:#69758d; font-size:12px; margin-top:20px; }
    @media (max-width: 600px) {
      .container { padding-top: 22px; }
      .card { border-radius:18px; }
      textarea { min-height: 280px; }
      .actions button { flex:1 1 calc(50% - 5px); }
      .result-head { align-items:flex-start; flex-direction:column; }
    }
  </style>
</head>
<body>
  <main class="container">
    <header>
      <div class="logo">⚡ يعمل بالكامل داخل المتصفح</div>
      <h1>JSON → CSV</h1>
      <p>الصق JSON، حوّله إلى CSV، وانسخه أو حمّله. بدون رفع ملفات وبدون حساب.</p>
    </header>

    <section class="card editor">
      <div class="label-row">
        <span class="label">JSON</span>
        <span class="hint">يفضل أن يكون Array من Objects</span>
      </div>
      <textarea id="jsonInput" spellcheck="false" placeholder='[
  {"name":"Ahmad","age":20,"city":"Gaza"},
  {"name":"Omar","age":22,"city":"Rafah"}
]'></textarea>

      <div class="actions">
        <button class="primary" id="convertBtn">تحويل إلى CSV</button>
        <button id="clearBtn">مسح</button>
        <button id="copyBtn" disabled>نسخ CSV</button>
        <button id="downloadBtn" disabled>تحميل CSV</button>
      </div>
      <div id="status" class="status"></div>
    </section>

    <section class="card result" aria-live="polite">
      <div class="result-head">
        <h2>معاينة النتيجة</h2>
        <span class="hint" id="rowCount">لا توجد بيانات</span>
      </div>
      <div id="tableContainer" class="empty">الصق JSON ثم اضغط «تحويل إلى CSV»</div>
    </section>

    <footer>JSON → CSV · التحويل يتم محليًا على جهازك</footer>
  </main>

  <script>
    const input = document.getElementById('jsonInput');
    const convertBtn = document.getElementById('convertBtn');
    const clearBtn = document.getElementById('clearBtn');
    const copyBtn = document.getElementById('copyBtn');
    const downloadBtn = document.getElementById('downloadBtn');
    const status = document.getElementById('status');
    const tableContainer = document.getElementById('tableContainer');
    const rowCount = document.getElementById('rowCount');

    let csvOutput = '';

    function flatten(value, prefix = '', out = {}) {
      if (value === null || value === undefined) {
        if (prefix) out[prefix] = '';
        return out;
      }
      if (Array.isArray(value)) {
        if (!prefix) return out;
        const simple = value.every(v => v === null || ['string','number','boolean'].includes(typeof v));
        out[prefix] = simple ? value.join(', ') : JSON.stringify(value);
        return out;
      }
      if (typeof value === 'object') {
        const keys = Object.keys(value);
        if (!keys.length && prefix) out[prefix] = '{}';
        for (const key of keys) {
          flatten(value[key], prefix ? `${prefix}.${key}` : key, out);
        }
        return out;
      }
      if (prefix) out[prefix] = value;
      return out;
    }

    function normalizeData(parsed) {
      if (Array.isArray(parsed)) return parsed;
      if (parsed && typeof parsed === 'object') return [parsed];
      throw new Error('JSON يجب أن يكون Object أو Array.');
    }

    function csvEscape(value) {
      const text = value === null || value === undefined ? '' : String(value);
      return /[",\n\r]/.test(text) ? `"${text.replace(/"/g, '""')}"` : text;
    }

    function buildCSV(rows) {
      const flattened = rows.map(row => flatten(row));
      const columns = [...new Set(flattened.flatMap(row => Object.keys(row)))];
      if (!columns.length) throw new Error('لم يتم العثور على بيانات قابلة للتحويل.');
      const lines = [columns.map(csvEscape).join(',')];
      for (const row of flattened) {
        lines.push(columns.map(column => csvEscape(row[column] ?? '')).join(','));
      }
      return { csv: lines.join('\r\n'), columns, rows: flattened };
    }

    function renderTable(columns, rows) {
      const table = document.createElement('table');
      const thead = document.createElement('thead');
      const headRow = document.createElement('tr');
      columns.forEach(column => {
        const th = document.createElement('th');
        th.textContent = column;
        headRow.appendChild(th);
      });
      thead.appendChild(headRow);
      table.appendChild(thead);

      const tbody = document.createElement('tbody');
      rows.forEach(row => {
        const tr = document.createElement('tr');
        columns.forEach(column => {
          const td = document.createElement('td');
          td.textContent = row[column] ?? '';
          tr.appendChild(td);
        });
        tbody.appendChild(tr);
      });
      table.appendChild(tbody);

      tableContainer.className = 'table-wrap';
      tableContainer.replaceChildren(table);
    }

    function setStatus(message = '', type = '') {
      status.textContent = message;
      status.className = `status ${type}`;
    }

    function convert() {
      setStatus('');
      const raw = input.value.trim();
      if (!raw) {
        setStatus('الصق JSON أولًا.', 'error');
        return;
      }

      try {
        const parsed = JSON.parse(raw);
        const data = normalizeData(parsed);
        const result = buildCSV(data);
        csvOutput = result.csv;
        renderTable(result.columns, result.rows);
        rowCount.textContent = `${result.rows.length} صف · ${result.columns.length} عمود`;
        copyBtn.disabled = false;
        downloadBtn.disabled = false;
        setStatus('تم التحويل بنجاح.', 'success');
      } catch (error) {
        csvOutput = '';
        copyBtn.disabled = true;
        downloadBtn.disabled = true;
        rowCount.textContent = 'لا توجد بيانات';
        tableContainer.className = 'empty';
        tableContainer.textContent = 'تعذر تحويل JSON.';
        setStatus(error instanceof SyntaxError ? 'JSON غير صالح. راجع الأقواس والفواصل وعلامات الاقتباس.' : error.message, 'error');
      }
    }

    convertBtn.addEventListener('click', convert);

    clearBtn.addEventListener('click', () => {
      input.value = '';
      csvOutput = '';
      copyBtn.disabled = true;
      downloadBtn.disabled = true;
      rowCount.textContent = 'لا توجد بيانات';
      tableContainer.className = 'empty';
      tableContainer.textContent = 'الصق JSON ثم اضغط «تحويل إلى CSV»';
      setStatus('');
      input.focus();
    });

    copyBtn.addEventListener('click', async () => {
      if (!csvOutput) return;
      try {
        await navigator.clipboard.writeText(csvOutput);
        setStatus('تم نسخ CSV.', 'success');
      } catch {
        setStatus('تعذر النسخ تلقائيًا. استخدم النسخ اليدوي.', 'error');
      }
    });

    downloadBtn.addEventListener('click', () => {
      if (!csvOutput) return;
      const blob = new Blob(["\uFEFF" + csvOutput], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.download = 'converted.csv';
      document.body.appendChild(link);
      link.click();
      link.remove();
      URL.revokeObjectURL(url);
      setStatus('تم تجهيز ملف CSV.', 'success');
    });
  </script>
</body>
</html>
