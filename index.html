<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#070b14"><meta name="description" content="منصة اختبارات متعددة الخيارات"><title>اختبر نفسك | منصة الاختبارات</title><style>
:root{--bg:#060912;--card:rgba(13,19,33,.84);--card2:#0b1220;--line:rgba(255,255,255,.09);--text:#f7f8fc;--muted:#91a0b8;--p:#7665ff;--p2:#22c7da;--good:#35d18a;--bad:#ff5f78;--shadow:0 28px 90px #0008}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;min-height:100vh;color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif;background:radial-gradient(circle at 8% 0,#7665ff2b,transparent 29%),radial-gradient(circle at 94% 18%,#22c7da16,transparent 26%),var(--bg);overflow-x:hidden}body:before{content:"";position:fixed;inset:0;pointer-events:none;background-image:linear-gradient(#fff00008 1px,transparent 1px),linear-gradient(90deg,#fff00008 1px,transparent 1px);background-size:42px 42px;mask-image:linear-gradient(#000,transparent 75%)}button,select{font:inherit}.wrap{width:min(1080px,calc(100% - 24px));margin:auto;padding:18px 0 55px}.hero{text-align:center;padding:34px 0 28px;animation:rise .6s ease}.badge{display:inline-flex;align-items:center;gap:7px;padding:7px 12px;border:1px solid var(--line);border-radius:999px;color:#cec8ff;background:#fff00008;font-size:11px}.pulse{width:6px;height:6px;border-radius:50%;background:var(--good);box-shadow:0 0 15px var(--good)}.hero h1{font-size:clamp(40px,8vw,72px);letter-spacing:-3px;margin:15px 0 8px;line-height:1;background:linear-gradient(100deg,#fff,#b9b0ff 55%,#76e9f5);-webkit-background-clip:text;color:transparent}.hero p{color:var(--muted);max-width:620px;margin:auto;line-height:1.9;font-size:13px}.panel{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:18px;box-shadow:var(--shadow);backdrop-filter:blur(18px);animation:rise .55s ease both}.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:16px}.step{padding:10px;border:1px solid var(--line);border-radius:13px;text-align:center;color:#718097;font-size:10px;transition:.2s}.step b{display:block;color:inherit;font-size:13px;margin-bottom:3px}.step.active{color:#fff;border-color:#7665ff88;background:#7665ff15}.step.done{color:#a9efd2;border-color:#35d18a55}.selection{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.field label{display:block;font-size:11px;color:#b8c5d6;font-weight:750;margin-bottom:7px}.field select{width:100%;padding:12px;border-radius:13px;border:1px solid var(--line);background:#080f1b;color:var(--text);outline:0;transition:.2s}.field select:focus{border-color:#7665ff;box-shadow:0 0 0 3px #7665ff16}.field select:disabled{opacity:.42}.list{display:grid;gap:10px;margin-top:16px}.quiz{display:flex;align-items:center;justify-content:space-between;gap:15px;padding:15px;border:1px solid var(--line);border-radius:16px;background:#fff00003;transition:transform .2s,border-color .2s,background .2s}.quiz:hover{transform:translateY(-2px);border-color:#7665ff66;background:#7665ff08}.quiz h3{margin:0 0 5px;font-size:14px}.quiz p{margin:0;color:var(--muted);font-size:11px}.btn{border:1px solid var(--line);border-radius:12px;padding:10px 15px;background:#17233a;color:#fff;font-weight:800;cursor:pointer;transition:.18s}.btn:hover:not(:disabled){transform:translateY(-1px);filter:brightness(1.08)}.btn:disabled{opacity:.45;cursor:not-allowed}.primary{background:linear-gradient(135deg,var(--p),#5141d9);border:0;box-shadow:0 8px 22px #7665ff25}.empty{text-align:center;padding:34px;color:var(--muted);border:1px dashed var(--line);border-radius:16px}.quiz-view{margin-top:15px}.quiz-top{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:10px;color:#dce4f2;font-size:12px}.progress{height:7px;background:#fff0000b;border-radius:99px;overflow:hidden;margin-bottom:20px}.progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--p),var(--p2));transition:width .35s}.question h2{font-size:20px;line-height:1.75;margin:0 0 16px}.options{display:grid;gap:9px}.option{width:100%;text-align:right;padding:14px;border:1px solid var(--line);border-radius:13px;background:#091321;color:#e8edf7;cursor:pointer;transition:.18s}.option:hover:not(:disabled){border-color:#7665ff88;transform:translateX(-2px)}.option.selected{border-color:#7665ff;background:#7665ff18}.option.correct{border-color:var(--good);background:#35d18a12}.option.wrong{border-color:var(--bad);background:#ff5f7812}.option:disabled{cursor:default}.quiz-actions{display:flex;justify-content:space-between;gap:8px;margin-top:16px}.explanation{margin-top:13px;padding:12px;border-radius:12px;background:#fff00006;color:#aebbd0;font-size:11px;line-height:1.8;border-right:2px solid var(--p)}.result{text-align:center;padding:30px 10px}.score{font-size:54px;font-weight:900;margin:8px 0;background:linear-gradient(100deg,#fff,#76e9f5);-webkit-background-clip:text;color:transparent}.result p{color:var(--muted)}.hide{display:none!important}footer{text-align:center;color:#5e6b82;font-size:10px;margin-top:20px}@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}@media(max-width:700px){.selection{grid-template-columns:1fr}.steps{grid-template-columns:repeat(2,1fr)}.quiz{align-items:stretch;flex-direction:column}.quiz .btn{width:100%}.quiz-actions .btn{flex:1}.hero{padding-top:22px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
</style></head><body><main class="wrap"><header class="hero"><span class="badge"><i class="pulse"></i> اختبارات متعددة الخيارات · محتوى ديناميكي</span><h1>اختبر نفسك</h1><p>اختر الفرع، المادة والدرس، ثم ابدأ الاختبار. واجهة خفيفة وسريعة ومهيأة للمحتوى الديناميكي.</p></header><section class="panel"><div class="steps"><div class="step active" id="s1"><b>1</b>الفرع</div><div class="step" id="s2"><b>2</b>المادة</div><div class="step" id="s3"><b>3</b>الدرس</div><div class="step" id="s4"><b>4</b>الاختبار</div></div><div class="selection"><div class="field"><label>الفرع</label><select id="branch"><option value="">اختر الفرع</option></select></div><div class="field"><label>المادة</label><select id="subject" disabled><option value="">اختر المادة</option></select></div><div class="field"><label>الدرس</label><select id="lesson" disabled><option value="">اختر الدرس</option></select></div></div><div id="quizList" class="list"><div class="empty">اختر الفرع ثم المادة ثم الدرس لعرض الاختبارات.</div></div></section><section id="quizView" class="panel quiz-view hide" aria-live="polite"></section><footer>Quiz Platform · جميع عمليات الاختبار تتم في المتصفح</footer></main><script>
const $=id=>document.getElementById(id);let data={branches:[],subjects:[],lessons:[],quizzes:[]},currentQuiz=null,index=0,score=0,selected=null;
const sample={branches:[{id:'scientific',name:'العلمي'},{id:'literary',name:'الأدبي'}],subjects:[{id:'arabic',name:'اللغة العربية',branchId:'scientific'},{id:'math',name:'الرياضيات',branchId:'scientific'},{id:'arabic-lit',name:'اللغة العربية',branchId:'literary'}],lessons:[{id:'adab',name:'الأدب',subjectId:'arabic'},{id:'matrices',name:'المصفوفات',subjectId:'math'},{id:'adab-lit',name:'الأدب',subjectId:'arabic-lit'}],quizzes:[{id:'demo',title:'اختبار الأدب التجريبي',lessonId:'adab',duration:10,questions:[{text:'ما المقصود بالأدب؟',options:['التعبير الفني عن التجربة الإنسانية','علم الأرقام','نوع من الرياضيات','قواعد البرمجة'],correctIndex:0,explanation:'الأدب تعبير فني ولغوي عن التجربة الإنسانية.'},{text:'أي مما يلي يُعد جنسًا أدبيًا؟',options:['الرواية','المعادلة','الخوارزمية','المعادالج'],correctIndex:0,explanation:'الرواية من الأجناس الأدبية.'}]}]};
function esc(v){return String(v).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}function fill(sel,items,placeholder){sel.innerHTML=`<option value="">${placeholder}</option>`;for(const x of items){const o=document.createElement('option');o.value=x.id;o.textContent=x.name||x.title;sel.append(o)}sel.disabled=!items.length}function setSteps(stage){['s1','s2','s3','s4'].forEach((id,i)=>$(id).className='step '+(i+1<stage?'done ':'')+(i+1===stage?'active':''))}
function loadData(){try{const raw=localStorage.getItem('quizContent');data=raw?JSON.parse(raw):sample;if(!Array.isArray(data.branches)||!Array.isArray(data.subjects)||!Array.isArray(data.lessons)||!Array.isArray(data.quizzes))throw 0}catch{data=sample}fill($('branch'),data.branches,'اختر الفرع');setSteps(1)}
$('branch').onchange=()=>{fill($('subject'),data.subjects.filter(x=>x.branchId===$('branch').value),'اختر المادة');$('lesson').innerHTML='<option value="">اختر الدرس</option>';$('lesson').disabled=true;clearList('اختر المادة لعرض الدروس والاختبارات.');setSteps(2)};$('subject').onchange=()=>{fill($('lesson'),data.lessons.filter(x=>x.subjectId===$('subject').value),'اختر الدرس');clearList('اختر الدرس لعرض الاختبارات.');setSteps(3)};$('lesson').onchange=()=>{showQuizzes();setSteps(4)};
function clearList(text){$('quizList').innerHTML=`<div class="empty">${text}</div>`;$('quizView').classList.add('hide')};function showQuizzes(){const lesson=$('lesson').value,list=data.quizzes.filter(q=>q.lessonId===lesson);if(!lesson){clearList('اختر الدرس لعرض الاختبارات.');return}if(!list.length){clearList('لا يوجد اختبار لهذا الدرس حاليًا.');return}$('quizList').innerHTML=list.map(q=>`<article class="quiz"><div><h3>${esc(q.title)}</h3><p>${q.questions?.length||0} سؤال · ${q.duration||'—'} دقيقة</p></div><button class="btn primary" data-id="${esc(q.id)}">ابدأ الاختبار</button></article>`).join('');$('quizList').querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>startQuiz(b.dataset.id))}
function startQuiz(id){currentQuiz=data.quizzes.find(q=>q.id===id);if(!currentQuiz?.questions?.length)return;index=0;score=0;selected=null;$('quizView').classList.remove('hide');renderQuestion();$('quizView').scrollIntoView({behavior:'smooth',block:'start'})}
function renderQuestion(){const q=currentQuiz.questions[index],total=currentQuiz.questions.length,percent=((index)/total)*100;$('quizView').innerHTML=`<div class="quiz-top"><strong>${esc(currentQuiz.title)}</strong><span>${index+1} / ${total}</span></div><div class="progress"><i style="width:${percent}%"></i></div><div class="question"><h2>${esc(q.text)}</h2><div class="options">${q.options.map((o,i)=>`<button class="option" data-i="${i}">${esc(o)}</button>`).join('')}</div></div><div class="quiz-actions"><button class="btn" id="exit">إنهاء</button><button class="btn primary" id="next" disabled>${index===total-1?'إنهاء الاختبار':'التالي'}</button></div>`;$('quizView').querySelectorAll('.option').forEach(b=>b.onclick=()=>choose(+b.dataset.i));$('exit').onclick=()=>{$('quizView').classList.add('hide')};$('next').onclick=nextQuestion}
function choose(i){if(selected!==null)return;selected=i;const q=currentQuiz.questions[index],opts=[...$('quizView').querySelectorAll('.option')];opts.forEach((b,n)=>{b.disabled=true;if(n===q.correctIndex)b.classList.add('correct');if(n===i&&i!==q.correctIndex)b.classList.add('wrong');if(n===i)b.classList.add('selected')});if(i===q.correctIndex)score++;if(q.explanation)$('quizView').querySelector('.question').insertAdjacentHTML('beforeend',`<div class="explanation">${esc(q.explanation)}</div>`);$('next').disabled=false}
function nextQuestion(){if(selected===null)return;if(index===currentQuiz.questions.length-1){showResult();return}index++;renderQuestion();$('quizView').scrollIntoView({behavior:'smooth',block:'center'})}function showResult(){const total=currentQuiz.questions.length,pct=Math.round(score/total*100);$('quizView').innerHTML=`<div class="result"><div class="badge">انتهى الاختبار</div><h2>نتيجتك</h2><div class="score">${score} / ${total}</div><p>${pct}% إجابات صحيحة</p><button class="btn primary" id="again">إعادة الاختبار</button></div>`;$('again').onclick=()=>startQuiz(currentQuiz.id)}loadData();
</script></body></html>
