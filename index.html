<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#060912"><title>اختبر نفسك - منهاج</title>
<style>
body{margin:0;background:#060912;color:#f7f8fc;font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif}.wrap{width:min(1080px,calc(100% - 24px));margin:auto;padding:22px 0 55px}.minhaj-link,.ai-fab{position:fixed;z-index:20;display:flex;align-items:center;justify-content:center;border-radius:15px;text-decoration:none;color:#fff;font-weight:900;border:1px solid #ffffff18;cursor:pointer}.minhaj-link{top:18px;right:18px;width:116px;height:48px;background:linear-gradient(120deg,#20d6c7,#2698ff,#6f5cff)}.ai-fab{left:18px;bottom:18px;width:58px;height:58px;background:linear-gradient(135deg,#7665ff,#22c7da);box-shadow:0 12px 35px #0008;font-size:25px}.hero{text-align:center;padding:45px 0 30px}.brand{display:flex;align-items:center;justify-content:center;gap:10px;font-size:14px;font-weight:800;color:#aeb8ca}.brand span{color:#8b7cff}.hero h1{font-size:clamp(40px,8vw,70px);margin:12px 0;background:linear-gradient(100deg,#fff,#b9b0ff,#76e9f5);-webkit-background-clip:text;color:transparent}.hero p{color:#91a0b8;font-size:13px;line-height:1.9}.panel{background:#0d1321e8;border:1px solid #ffffff16;border-radius:22px;padding:18px;box-shadow:0 25px 80px #0008}.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:16px}.step{padding:10px;border:1px solid #ffffff12;border-radius:13px;text-align:center;color:#718097;font-size:10px}.step b{display:block;font-size:13px}.step.active{color:#fff;border-color:#7665ff88;background:#7665ff15}.step.done{color:#a9efd2;border-color:#35d18a55}.selection{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.field label{display:block;font-size:11px;color:#b8c5d6;font-weight:750;margin-bottom:7px}.field select{width:100%;padding:12px;border-radius:13px;border:1px solid #ffffff12;background:#080f1b;color:#fff}.list{display:grid;gap:10px;margin-top:16px}.quiz{display:flex;align-items:center;justify-content:space-between;padding:15px;border:1px solid #ffffff12;border-radius:16px;background:#ffffff04}.quiz h3{margin:0 0 5px;font-size:14px}.quiz p{margin:0;color:#91a0b8;font-size:11px}.btn{border:1px solid #ffffff12;border-radius:12px;padding:10px 15px;background:#17233a;color:#fff;font-weight:800;cursor:pointer}.primary{background:linear-gradient(135deg,#7665ff,#5141d9);border:0}.empty{text-align:center;padding:34px;color:#91a0b8;border:1px dashed #ffffff15;border-radius:16px}.quiz-view{margin-top:15px}.quiz-top{display:flex;justify-content:space-between;margin-bottom:10px;font-size:12px}.progress{height:7px;background:#ffffff0b;border-radius:99px;overflow:hidden;margin-bottom:20px}.progress i{display:block;height:100%;background:linear-gradient(90deg,#7665ff,#22c7da)}.question h2{font-size:20px;line-height:1.75}.options{display:grid;gap:9px}.option{width:100%;text-align:right;padding:14px;border:2px solid #ffffff12;border-radius:13px;background:#091321;color:#e8edf7;cursor:pointer}.option.selected{border-color:#9b91ff;background:#7665ff2e}.quiz-actions{display:flex;justify-content:space-between;margin-top:16px}.explanation{margin-top:13px;padding:12px;border-radius:12px;background:#ffffff06;color:#aebbd0;font-size:11px;line-height:1.8;border-right:2px solid #7665ff}.score{font-size:54px;font-weight:900;text-align:center}.hide{display:none!important}
.ai-overlay{position:fixed;inset:0;background:#0009;z-index:50;display:none;align-items:flex-end;justify-content:center}.ai-overlay.open{display:flex}.ai-chat{width:min(560px,100%);height:min(720px,92vh);background:#0b111e;border:1px solid #ffffff16;border-radius:24px 24px 0 0;display:flex;flex-direction:column;box-shadow:0 -20px 80px #000b}.ai-head{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:1px solid #ffffff12}.ai-head strong{font-size:16px}.ai-head small{display:block;color:#8491a8;margin-top:3px}.ai-close{background:none;border:0;color:#fff;font-size:24px;cursor:pointer}.ai-messages{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:10px}.msg{max-width:86%;padding:11px 13px;border-radius:16px;line-height:1.8;font-size:14px;white-space:pre-wrap}.msg.user{align-self:flex-start;background:#7665ff;color:#fff;border-bottom-left-radius:5px}.msg.ai{align-self:flex-end;background:#151f32;color:#e7edf8;border-bottom-right-radius:5px}.ai-form{display:flex;gap:8px;padding:12px;border-top:1px solid #ffffff12}.ai-input{flex:1;resize:none;min-height:46px;max-height:120px;border:1px solid #ffffff15;border-radius:14px;background:#070d18;color:#fff;padding:12px;font:inherit;outline:none}.ai-send{width:52px;border:0;border-radius:14px;background:#7665ff;color:#fff;font-size:20px;cursor:pointer}.ai-send:disabled{opacity:.5}.typing{opacity:.65}
@media(max-width:700px){.minhaj-link{top:12px;right:12px;width:100px;height:42px;font-size:14px}.ai-fab{left:12px;bottom:12px}.hero{padding-top:70px}.selection{grid-template-columns:1fr}.steps{grid-template-columns:repeat(2,1fr)}.quiz{flex-direction:column;align-items:stretch}.quiz .btn{width:100%}.option{padding:16px;font-size:15px;min-height:54px}}
</style>
</head>
<body>
<a class="minhaj-link" href="https://pls455.github.io/Minhaj/" aria-label="فتح منهاج">منهاج</a>
<button class="ai-fab" id="aiOpen" aria-label="مساعد الذكاء الاصطناعي">✦</button>
<main class="wrap">
<header class="hero"><div class="brand"><span>اختبر نفسك</span><b>-</b><span>منهاج</span></div><h1>اختبر نفسك</h1><p>اختر الفرع ثم المادة ثم الدرس. المحتوى ديناميكي ويُقرأ مباشرة من Firebase.</p></header>
<section class="panel"><div class="steps"><div class="step active" id="s1"><b>1</b>الفرع</div><div class="step" id="s2"><b>2</b>المادة</div><div class="step" id="s3"><b>3</b>الدرس</div><div class="step" id="s4"><b>4</b>الاختبار</div></div><div class="selection"><div class="field"><label>الفرع</label><select id="branch"><option>جارٍ التحميل…</option></select></div><div class="field"><label>المادة</label><select id="subject" disabled><option>اختر الفرع</option></select></div><div class="field"><label>الدرس</label><select id="lesson" disabled><option>اختر المادة</option></select></div></div><div id="quizList" class="list"><div class="empty">جارٍ تحميل المحتوى…</div></div></section>
<section id="quizView" class="panel quiz-view hide"></section>
</main>
<div class="ai-overlay" id="aiOverlay"><section class="ai-chat" role="dialog" aria-modal="true" aria-label="مساعد منهاج"><header class="ai-head"><div><strong>مساعد منهاج AI</strong><small>اسأل عن السؤال أو اطلب شرحًا</small></div><button class="ai-close" id="aiClose">×</button></header><div class="ai-messages" id="aiMessages"><div class="msg ai">مرحبًا. أرسل سؤالك وسأحاول مساعدتك.</div></div><form class="ai-form" id="aiForm"><textarea id="aiInput" class="ai-input" maxlength="4000" placeholder="اكتب سؤالك هنا…" autocomplete="off"></textarea><button class="ai-send" id="aiSend" type="submit">➤</button></form></section></div>
<script type="module">
import{initializeApp}from'https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js';
import{getFirestore,collection,getDocs}from'https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js';
import{firebaseConfig}from'./firebase-config.js';
import{AI_API_URL}from'./ai-config.js';
initializeApp(firebaseConfig);const db=getFirestore();const $=id=>document.getElementById(id);let data={branches:[],subjects:[],lessons:[],quizzes:[]},currentQuiz=null,index=0,score=0,selected=null,aiHistory=[];
const esc=v=>String(v??'').replace(/[&<>'\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','\"':'&quot;'}[c]));
function fill(s,items,p){s.innerHTML=`<option value="">${p}</option>`;items.forEach(x=>{const o=document.createElement('option');o.value=x.id;o.textContent=x.name;s.append(o)});s.disabled=!items.length}function steps(n){for(let i=1;i<=4;i++)$('s'+i).className='step '+(i<n?'done ':'')+(i===n?'active':'')}
async function load(){try{const[b,s,l,q]=await Promise.all(['branches','subjects','lessons','quizzes'].map(c=>getDocs(collection(db,c))));data={branches:b.docs.map(x=>({id:x.id,...x.data()})),subjects:s.docs.map(x=>({id:x.id,...x.data()})),lessons:l.docs.map(x=>({id:x.id,...x.data()})),quizzes:q.docs.map(x=>({id:x.id,...x.data()}))};fill($('branch'),data.branches,'اختر الفرع');$('quizList').innerHTML='<div class="empty">اختر الفرع ثم المادة ثم الدرس.</div>'}catch(e){$('quizList').innerHTML='<div class="empty">تعذر تحميل المحتوى من Firebase. تحقق من Firestore Rules.</div>'}}
$('branch').onchange=()=>{const id=$('branch').value;const subjects=data.subjects.filter(x=>(x.branchIds||[]).includes(id)||x.branchId===id);fill($('subject'),subjects,'اختر المادة');fill($('lesson'),[],'اختر المادة');$('quizList').innerHTML='<div class="empty">اختر المادة ثم الدرس.</div>';steps(2)};
$('subject').onchange=()=>{const subjectId=$('subject').value,branchId=$('branch').value;const lessons=data.lessons.filter(x=>x.subjectId===subjectId&&((x.branchIds||[]).includes(branchId)||x.branchId===branchId));fill($('lesson'),lessons,'اختر الدرس');$('quizList').innerHTML='<div class="empty">اختر الدرس لعرض الاختبارات.</div>';steps(3)};
$('lesson').onchange=show;
function show(){steps(4);const lessonId=$('lesson').value,branchId=$('branch').value,list=data.quizzes.filter(q=>q.lessonId===lessonId&&((q.branchIds||[]).includes(branchId)||q.branchId===branchId));if(!list.length){$('quizList').innerHTML='<div class="empty">لا يوجد اختبار لهذا الدرس حاليًا.</div>';return}$('quizList').innerHTML=list.map(q=>`<article class="quiz"><div><h3>${esc(q.title)}</h3><p>${q.questions?.length||0} سؤال · ${q.duration||'—'} دقيقة</p></div><button class="btn primary" data-id="${esc(q.id)}">ابدأ الاختبار</button></article>`).join('');$('quizList').querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>start(b.dataset.id))}
function start(id){currentQuiz=data.quizzes.find(q=>q.id===id);if(!currentQuiz?.questions?.length)return;index=0;score=0;selected=null;$('quizView').classList.remove('hide');render()}
function render(){const q=currentQuiz.questions[index],total=currentQuiz.questions.length;$('quizView').innerHTML=`<div class="quiz-top"><b>${esc(currentQuiz.title)}</b><span>${index+1} / ${total}</span></div><div class="progress"><i style="width:${(index/total)*100}%"></i></div><div class="question"><h2>${esc(q.text)}</h2><div class="options">${q.options.map((o,i)=>`<button class="option" data-i="${i}" type="button">${esc(o)}</button>`).join('')}</div></div><div class="quiz-actions"><button class="btn" id="exit">خروج</button><button class="btn primary" id="next" disabled>${index===total-1?'إنهاء الاختبار':'التالي'}</button></div>`;$('quizView').querySelectorAll('.option').forEach(b=>b.onclick=()=>choose(+b.dataset.i));$('exit').onclick=()=>$('quizView').classList.add('hide');$('next').onclick=next}
function choose(i){selected=i;$('quizView').querySelectorAll('.option').forEach((b,n)=>b.classList.toggle('selected',n===i));$('next').disabled=false}
function next(){if(selected===null)return;const q=currentQuiz.questions[index];if(selected===q.correctIndex)score++;if(q.explanation)$('quizView').querySelector('.question').insertAdjacentHTML('beforeend',`<div class="explanation">${esc(q.explanation)}</div>`);if(index===currentQuiz.questions.length-1){setTimeout(finish,120);return}index++;selected=null;render()}
function finish(){const total=currentQuiz.questions.length;$('quizView').innerHTML=`<div><h2 style="text-align:center">انتهى الاختبار</h2><div class="score">${score} / ${total}</div><p style="text-align:center;color:#91a0b8">${Math.round(score/total*100)}% إجابات صحيحة</p><button class="btn primary" id="again">إعادة الاختبار</button></div>`;$('again').onclick=()=>start(currentQuiz.id)}
function addMsg(text,role,cls=''){const d=document.createElement('div');d.className=`msg ${role} ${cls}`;d.textContent=text;$('aiMessages').append(d);$('aiMessages').scrollTop=$('aiMessages').scrollHeight;return d}
$('aiOpen').onclick=()=>{$('aiOverlay').classList.add('open');$('aiInput').focus()};$('aiClose').onclick=()=>$('aiOverlay').classList.remove('open');$('aiOverlay').onclick=e=>{if(e.target===$('aiOverlay'))$('aiOverlay').classList.remove('open')};
$('aiForm').onsubmit=async e=>{e.preventDefault();const input=$('aiInput'),text=input.value.trim();if(!text)return;if(AI_API_URL.includes('YOUR-WORKER')){addMsg('مساعد AI جاهز في المشروع، لكن لم يتم ربط رابط Cloudflare Worker بعد. ضع الرابط في ai-config.js بعد نشر الـWorker.','ai');return}addMsg(text,'user');input.value='';$('aiSend').disabled=true;const typing=addMsg('يكتب…','ai','typing');aiHistory.push({role:'user',content:text});try{const r=await fetch(AI_API_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:aiHistory.slice(-10)})});const d=await r.json();typing.remove();if(!r.ok)throw new Error(d.error||'AI request failed');const answer=d.answer||'لم تصل إجابة.';addMsg(answer,'ai');aiHistory.push({role:'assistant',content:answer})}catch(err){typing.remove();addMsg('تعذر الاتصال بمساعد AI حاليًا. تأكد من نشر Cloudflare Worker ورابطه في ai-config.js.','ai')}finally{$('aiSend').disabled=false;input.focus()}};
load();
</script>
</body></html>
